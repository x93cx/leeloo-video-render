# Рендер відео за сценаріями з контент-плану дашборду Insta Viral.
# Запуск: сигнал з дашборду (repository_dispatch «render»), вручну (Run workflow) і раз на 4 години для підстраховки.
name: Render videos

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      demo:
        description: "Лише демо-ролик samples/demo.md (перевірка монтажу, черга не чіпається)"
        type: boolean
        default: false
  schedule:
    - cron: "23 */4 * * *"

permissions:
  contents: read
  models: read # безкоштовні GitHub Models планують кадри: запити для стоку й промпти для картинок

concurrency:
  group: render # один рендер за раз: другий сигнал чекає, а не дублює роботу
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-montserrat >/dev/null || true
          # Субтитрам потрібен ffmpeg з libass; якщо вбудований у imageio-ffmpeg без нього — ставимо системний.
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -hide_banner -filters | grep -q " ass " || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null

      - name: Render queued scripts
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          POLLINATIONS_VIDEO_MODEL: ${{ vars.POLLINATIONS_VIDEO_MODEL }}
          MEDIA_PROVIDER: pollinations
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          # Порожні змінні репозиторію не мають перекривати значення за замовчуванням у воркері.
          [ -z "$POLLINATIONS_IMAGE_MODEL" ] && unset POLLINATIONS_IMAGE_MODEL
          [ -z "$POLLINATIONS_VIDEO_MODEL" ] && unset POLLINATIONS_VIDEO_MODEL
          if [ "${{ inputs.demo }}" = "true" ]; then
            python video_worker.py --once --probe-llm || true
            python video_worker.py --file samples/demo.md --out videos --size 720x1280
          else
            python video_worker.py --once --out videos --size 720x1280
          fi

      - name: Keep demo video
        if: ${{ inputs.demo }}
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: videos/demo.mp4
          retention-days: 3
